; https://docs.platformio.org/page/projectconf.html


[platformio]
description = ABCD
default_envs = generic_stm32l051
;dwm3001_nrf52833


[env]
framework = arduino
monitor_speed = 460800 ;115200
lib_deps = https://github.com/DrGlaucous/DW3000


; for stm32l051c8t6
[env:generic_stm32l051]
platform = ststm32
board = generic_stm32l051c8t6
;board = rhf76_052

;board_build.variant = GENERIC_L051C8TX
board_build.mcu = stm32l051c8t6
board_build.f_cpu = 32000000L
upload_protocol = stlink
debug_tool = stlink
build_type = debug
build_flags = -O0 -g -ggdb




; upload flags to disable read-only mode on the STM32
; upload_flags =
;     -d2
;     -f
;     interface/stlink.cfg
;     -f
;     target/stm32l0.cfg
;     -c
;     init
;     -c
;     targets
;     -c
;     reset halt
;     -c
;     stm32l0x unlock 0
;     -c
;     reset run
;     -c
;     shutdown
; upload_command = openocd $UPLOAD_FLAGS






[env:dwm3001_nrf52833]

platform = nordicnrf52
board = bbcmicrobit_v2
board_build.mcu = nrf52833
board_build.f_cpu = 64000000L

;board_build.variants_dir = custom_variants
;board_build.variant = dwm3001c
board_build.variant = generic
build_type = debug
build_flags =
    -DNRF52833_XXAA
    -UNRF52832_XXAA

;for debugging
upload_protocol = jlink
debug_tool = jlink
debug_init_break = tb
debug_build_flags = -O0 -g -ggdb






