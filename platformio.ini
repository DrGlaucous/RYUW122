; https://docs.platformio.org/page/projectconf.html


; for stm32l051c8t6
[env:generic_stm32l051]
platform = ststm32
framework = arduino
board = nucleo_l053r8
monitor_speed = 115200
board_build.mcu = stm32l051c8t6
board_build.f_cpu = 32000000L
upload_protocol = stlink
debug_tool = stlink
build_type = debug
build_flags = 
    -O0 
    -g3
lib_deps = https://github.com/DrGlaucous/DW3000


[platformio]
description = ABCD





; upload flags to disable read-only mode on the STM32
; upload_flags =
;     -d2
;     -f
;     interface/stlink.cfg
;     -f
;     target/stm32l0.cfg
;     -c
;     init
;     -c
;     targets
;     -c
;     reset halt
;     -c
;     stm32l0x unlock 0
;     -c
;     reset run
;     -c
;     shutdown
; upload_command = openocd $UPLOAD_FLAGS







